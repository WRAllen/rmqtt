apiVersion: v1
kind: Namespace
metadata:
  name: rmqtt-test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rmqtt-operator
  namespace: rmqtt-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rmqtt-operator
  namespace: rmqtt-test
rules:
  - apiGroups: ["rmqtt.io"]
    resources: ["rmqttclusters"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["rmqtt.io"]
    resources: ["rmqttclusters/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps", "services", "pods", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rmqtt-operator
  namespace: rmqtt-test
subjects:
  - kind: ServiceAccount
    name: rmqtt-operator
    namespace: rmqtt-test
roleRef:
  kind: Role
  name: rmqtt-operator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rmqtt-operator
  namespace: rmqtt-test
  labels:
    app.kubernetes.io/name: rmqtt-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rmqtt-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rmqtt-operator
    spec:
      serviceAccountName: rmqtt-operator
      containers:
        - name: operator
          image: registry.cn-sh-02.sensecore.cn/ccr-ams-public/mirror/docker/rmqtt-test/rmqtt-operator:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              value: rmqtt-test
            - name: RECONCILE_INTERVAL_SECONDS
              value: "5"
            - name: LEADER_ELECTION_LEASE_NAME
              value: rmqtt-operator-leader
            - name: LEADER_ELECTION_LEASE_DURATION_SECONDS
              value: "30"
            - name: RUST_LOG
              value: info
