apiVersion: rmqtt.io/v1alpha1
kind: RmqttCluster
metadata:
  name: ams-rmqtt
  namespace: studio-ams-system
spec:
  replicas: 3
  image: registry.cn-sh-02.sensecore.cn/ccr-ams-public/mirror/docker/rmqtt-test/rmqtt:0.19.0-dynamic-peers-202608061642
  imagePullPolicy: IfNotPresent
  imageUpdate:
    autoRollout: true
    stabilizationSeconds: 60
  service:
    mqttPort: 1883
    mqttsPort: 8883
    wsPort: 8080
    wssPort: 8083
    httpApiPort: 6060
    grpcPort: 5363
    raftPort: 6003
  config:
    # Before uninstalling the old Helm release, copy ams-rmqtt-config to this
    # name. The operator overlays dynamic node IDs, peer lists and ports.
    baseConfigMapName: ams-rmqtt-operator-config
  resources:
    requests:
      cpu: "8"
      memory: 8Gi
    limits:
      cpu: "16"
      memory: 16Gi
  pod:
    annotations:
      ams.studio.sensecore.cn/scheduler: volcano
    serviceAccountName: ams-rmqtt
    imagePullSecrets:
      - name: image-pull-secret-stack
      - name: image-pull-secret-public
    schedulerName: default-scheduler
    enableServiceLinks: false
    terminationGracePeriodSeconds: 30
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: ams.studio.sensecore.cn/workload-type
                  operator: In
                  values:
                    - inference
    tolerations:
      - key: ams.studio.sensecore.cn/scheduling
        operator: Equal
        value: dedicated
        effect: NoSchedule
  monitoring:
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
      path: /api/v1/metrics/prometheus/sum
      interval: 60s
      scrapeTimeout: 10s
  raft:
    minReplicas: 3
    drainTimeoutSeconds: 1200
    endpointRemovalStableSeconds: 5
    scaleInStabilizationSeconds: 60
    handoffRollbackThresholdPercent: 80
    drainTimeoutAction: ForceContinue
    allowLeaderScaleIn: false
