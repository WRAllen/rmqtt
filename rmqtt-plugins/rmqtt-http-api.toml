##--------------------------------------------------------------------
## rmqtt-http-api
##--------------------------------------------------------------------

# See more keys and their definitions at https://github.com/rmqtt/rmqtt/blob/master/docs/en_US/http-api.md

## Max Row Limit
max_row_limit = 10_000
## HTTP Listener address
http_laddr = "0.0.0.0:6060"
## Indicates whether to print HTTP request logs
http_request_log = false

##Message expiration time, 0 means no expiration
message_expiry_interval = "5m"

## Minimum interval between demand-driven cluster metrics refreshes.
## Minimum 30s (legacy shorter values are clamped); longer values are honored.
## HTTP reads cached snapshots; local counters sample every 10s.
## Cold/older-than-120s cluster snapshots return 503 without blocking MQTT.
##
## Value: Duration
## Default: "30s"
prometheus_metrics_cache_interval = "30s"
